[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DDSim"
version = "0.2.0"
description = "Toolkit for Deep learning-driven Adaptive Simulations"
license = {text = "MIT"}
keywords = [
    "deep-learning",
    "adaptive-simulation",
    "hpc",
    "machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
authors = [
    {name = "Mariya Goliyad", email = "mariya.goliyad@rutgers.edu"},
    {name = "RADICAL Lab"},
]
maintainers = [
    {name = "Mariya Goliyad", email = "mariya.goliyad@rutgers.edu"},
]
readme = "README.md"
requires-python = ">=3.9"

dependencies = ["rhapsody-py", "radical-asyncflow @ git+https://github.com/radical-cybertools/radical.asyncflow.git@feature/rhapsody-2", "pyyaml", "ROSE @ git+https://github.com/radical-cybertools/ROSE.git"]

[tool.setuptools.packages.find]
include = ["ddsim*", "pipelines*"]

[project.urls]
Homepage = "https://github.com/radical-collaboration/DeepDriveSim"
Issues = "https://github.com/radical-collaboration/DeepDriveSim/issues"
Documentation = "https://radical-collaboration.github.io/DeepDriveSim/"

[project.optional-dependencies]
lint = ["ruff"]

# All test deps
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff"
]

doc = [
    "mkdocs==1.5.3",
    "mkdocs-material==9.5.9",
    "mkdocstrings[python]>=0.26.1",
    "mkdocs-gen-files==0.5.0",
    "mkdocs-literate-nav==0.6.1",
    "mkdocs-section-index==0.3.8",
    "mkdocs-glightbox",
    "mkdocs-material-extensions",
    "mkdocs-minify-plugin"
]

[tool.ruff]
line-length = 88
target-version = "py39"
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "N", "UP"]
ignore = ["UP007", "UP045"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "6.0"

testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["ddsim", "pipelines"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.codespell]
skip = """
.git,
.github,
__pycache__,
build,
dist,
.*egg-info
"""
