# =============================================================================
# DDSim (DummyWorkflow / DDMdWorkflow) — workflow-specific parameters
# =============================================================================

debug: false
engine: dragon       # concurrent | dragon 

# Per-replica home directories; replica_id is appended automatically.
home_dir: "~/DDSim"

num_inputs:               10    # number of dummy simulation inputs to generate
max_sim_batch:            4     # max simulations running in parallel
training_cores:           1     # cores reserved for training (subtracted from sim budget)
training_threshold:       0.5   # model-accuracy threshold to stop retraining
prediction_threshold:     0.5   # score below which a sim is cancelled
start_training_threshold: 1     # min completed sims before training starts
training_epochs:          1     # epochs per training iteration (0 = skip training)
free_resources_for_train: true  # preempt sims to free resources for training
sleep_time:               30    # seconds between main-loop iterations (> sim runtime)
ddsim_data_ready:         2     # signal inference-ready after this many sims complete

# Explicit src_dir so DummyWorkflow finds simulation.py/train.py etc. in the
# correct directory regardless of the $WORK_DIR env var.
src_dir: "$PROJECT/DeepDriveSim/workflows/dummy_workflow"

# Per-task conda python executables — set each to the python binary of the
# target conda environment, or leave empty to inherit the current interpreter.
sim_executable: ""            # e.g. /path/to/conda_sim/bin/python
train_executable: ""
active_learn_executable: ""
predict_executable: ""
check_accuracy_executable: ""

# DDMdWorkflow config (used when _USE_DUMMY = False in ddsim_workflow.py)
ddsim_config: "$PROJECT/DeepDriveSim/workflows/ddmd_workflow/data/new_lassen-keras-dbscan.yaml"
