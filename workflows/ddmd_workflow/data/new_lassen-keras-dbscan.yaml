title: BBA integration test
resource: access.bridges2
queue: GPU
schema_: local
project: cv19-a01
walltime_min: 290
max_iteration: 3
cpus_per_node: 40
gpus_per_node: 8
hardware_threads_per_cpu: 1
experiment_directory: /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/ddmd_test_experiments/bba-keras-dbscan-run-0
node_local_path: /tmp
molecular_dynamics_stage:
    pre_exec:
    #- . /etc/profile.d/conda.sh
    #- module load cuda/9.1.85
    #- unset PYTHONPATH
    - module load anaconda3
    - source activate base
    - conda activate /ocean/projects/dmr170002p/goliyad/conda_env/conda-openmm
    executable: /ocean/projects/dmr170002p/goliyad/conda_env/conda-openmm/bin/python
    arguments:
    - /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/sim/openmm/run_openmm.py
    cpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 4
        thread_type: OpenMP
    gpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 1
        thread_type: CUDA
    num_tasks: 8
    task_config:
        experiment_directory: set_by_deepdrivemd
        stage_idx: 0
        task_idx: 0
        output_path: set_by_deepdrivemd
        node_local_path: set_by_deepdrivemd
        pdb_file: set_by_deepdrivemd
        initial_pdb_dir: /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/data/bba
        solvent_type: implicit
        top_suffix: null
        simulation_length_ns: 100.0
        report_interval_ps: 1.0
        dt_ps: 0.002
        temperature_kelvin: 310.0
        heat_bath_friction_coef: 1.0
        wrap: false
        reference_pdb_file: /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/data/bba/1FME-folded.pdb
        openmm_selection:
        - CA
        mda_selection: protein and name CA
        threshold: 8.0
        contact_map: true
        point_cloud: false
        fraction_of_contacts: false
        in_memory: false
aggregation_stage:
    pre_exec: []
    executable: ''
    arguments: []
    cpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 1
        thread_type: null
    gpu_reqs:
        processes: 0
        process_type: null
        threads_per_process: 0
        thread_type: null
    skip_aggregation: true
    task_config:
        experiment_directory: set_by_deepdrivemd
        stage_idx: 0
        task_idx: 0
        output_path: set_by_deepdrivemd
        node_local_path: set_by_deepdrivemd
machine_learning_stage:
    pre_exec:
    #- . /etc/profile.d/conda.sh
    #- module load gcc/7.3.1
    #- module load cuda/10.1.243
    - export LANG=en_US.utf-8
    - export LC_ALL=en_US.utf-8
    - export HDF5_USE_FILE_LOCKING=FALSE
    - export IBM_POWERAI_LICENSE_ACCEPT=yes
    - unset PYTHONPATH
#    - module load gcc
    - export CUDA_HOME=/opt/packages/cuda/v12.6.1
    - export LD_LIBRARY_PATH=/opt/packages/cuda/v12.6.1/lib64:$LD_LIBRARY_PATH
    - export TF_ENABLE_XLA=0
    - export TF_FORCE_GPU_ALLOW_GROWTH=true
    - export XLA_FLAGS="--xla_gpu_strict_conv_algorithm_picker=false --xla_gpu_cuda_data_dir=/opt/packages/cuda/v12.6.1"
    - module load anaconda3
    - source /opt/packages/anaconda3-2024.10-1/etc/profile.d/conda.sh
    - conda activate /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras
    - unset CUDA_VISIBLE_DEVICES
    - export OMP_NUM_THREADS=4
    executable: /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras/bin/python
    arguments:
    - /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/models/keras_cvae/train.py
    cpu_reqs:
        processes: 1
        process_type: MPI
        threads_per_process: 4
        thread_type: OpenMP
    gpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 1
        thread_type: CUDA
    retrain_freq: 1
    task_config:
        experiment_directory: set_by_deepdrivemd
        stage_idx: 0
        task_idx: 0
        output_path: set_by_deepdrivemd
        node_local_path: set_by_deepdrivemd
        model_tag: set_by_deepdrivemd
        init_weights_path: null
        last_n_h5_files: 8
        k_random_old_h5_files: 8
        dataset_name: contact_map
        initial_shape:
        - 28
        - 28
        final_shape:
        - 28
        - 28
        - 1
        initial_epochs: 5
        epochs: 5
        batch_size: 32
        split_pct: 0.8
        shuffle: true
        latent_dim: 10
        conv_layers: 4
        conv_filters:
        - 64
        - 64
        - 64
        - 64
        conv_filter_shapes:
        -   - 3
            - 3
        -   - 3
            - 3
        -   - 3
            - 3
        -   - 3
            - 3
        conv_strides:
        -   - 1
            - 1
        -   - 2
            - 2
        -   - 1
            - 1
        -   - 1
            - 1
        dense_layers: 1
        dense_neurons:
        - 128
        dense_dropouts:
        - 0.25
model_selection_stage:
    pre_exec:
    #- . /etc/profile.d/conda.sh
    #- export IBM_POWERAI_LICENSE_ACCEPT=yes
    #- unset PYTHONPATH
    - module load anaconda3
    - source activate base
    - conda activate /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras
    executable: /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras/bin/python
    arguments:
    - /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/selection/latest/select_model.py
    cpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 4
        thread_type: OpenMP
    gpu_reqs:
        processes: 0
        process_type: null
        threads_per_process: 0
        thread_type: null
    task_config:
        experiment_directory: set_by_deepdrivemd
        stage_idx: 0
        task_idx: 0
        output_path: set_by_deepdrivemd
        node_local_path: set_by_deepdrivemd
        retrain_freq: 1
        checkpoint_dir: checkpoint
        checkpoint_suffix: .h5
agent_stage:
    pre_exec:
    - unset CUDA_VISIBLE_DEVICES
    - export LANG=en_US.utf-8
    - export LC_ALL=en_US.utf-8
    - export HDF5_USE_FILE_LOCKING=FALSE
    - export TF_ENABLE_XLA=0
    - export TF_FORCE_GPU_ALLOW_GROWTH=true
    - module load anaconda3
    - source /opt/packages/anaconda3-2024.10-1/etc/profile.d/conda.sh
    - conda activate /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras
    - export CUDA_HOME=/opt/packages/cuda/v12.6.1
    - export OMP_NUM_THREADS=4
    - export LD_LIBRARY_PATH=/opt/packages/cuda/v12.6.1/lib64:$LD_LIBRARY_PATH
    executable: /ocean/projects/dmr170002p/goliyad/conda_env/conda-keras/bin/python
    arguments:
    - /ocean/projects/dmr170002p/goliyad/DeepDriveSim/workflows/ddmd_workflow/agents/lof/lof.py
    cpu_reqs:
        processes: 1
        process_type: null
        threads_per_process: 8
        thread_type: OpenMP
    gpu_reqs:
        processes: 0
        process_type: null
        threads_per_process: 0
        thread_type: null
    task_config:
        experiment_directory: set_by_deepdrivemd
        stage_idx: 0
        task_idx: 0
        output_path: set_by_deepdrivemd
        node_local_path: set_by_deepdrivemd
        num_intrinsic_outliers: 8
        num_extrinsic_outliers: 8 
        intrinsic_score: lof 
        extrinsic_score: rmsd
        n_traj_frames: 100
        n_most_recent_h5_files: 3
        k_random_old_h5_files: 2
        sklearn_num_jobs: -1
        model_type: "keras_cvae"
        inference_batch_size: 1024