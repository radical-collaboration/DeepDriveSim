# =============================================================================
# Exchange Workflow — workflow-specific parameters
# =============================================================================

debug: true
# engine: dragon  # use DDSIM_BACKEND env var instead
num_replicas: 1
telemetry:     true
telemetry_dir: "ala_dipep_output"

# ── MD / Exchange simulation parameters ──────────────────────────────────────

#----Paths----------------
input: /work/nvme/bdyk/mgoliyad1/DeepDriveSim/workflows/exchange_workflow/input
work_dir: /work/nvme/bdyk/mgoliyad1/DeepDriveSim/workflows/exchange_workflow/output
top_file: ala_dipep.top 

gro_files:
  - md_temp_1.gro
  - md_temp_2.gro
  - md_temp_3.gro
  - md_temp_4.gro
  - md_temp_5.gro
  - md_temp_6.gro 
  - md_temp_7.gro
  - md_temp_8.gro

temperatures:
  - 300
  - 323
  - 347
  - 373
  - 402
  - 423
  - 465
  - 500

#-----Simulation parameters----------------------
num_init_sims:     8
start_cycle: 0
max_equil_steps:   100
production_steps:  100
exchange_step_interval: 100
max_exchange_cycles:   3

# experiment_dir: "exchange_output"   # leave unset to skip experiment dir creation

# ── Per-task resource descriptions ───────────────────────────────────────────
# cpu_reqs: cores per rank
# gpu_reqs: GPUs per rank (0 = CPU only)
# pre_exec:  list of shell commands run before the task (module loads, env vars, etc.)
tasks:
  MD:
    cpu_reqs: 4
    gpu_reqs: 0
    pre_exec: []
  EXCHANGE:
    cpu_reqs: 2
    gpu_reqs: 0
    pre_exec: []

# Python executable for all tasks — set to the python binary of the target venv,
# or leave empty to inherit the current interpreter.
executable: ""


