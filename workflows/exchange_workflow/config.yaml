# Exchange workflow config

# ── Execution ─────────────────────────────────────────────────────────────────
engine:          dragon # concurrent (asyncio) or dragon

# Number of MD simulations to launch initially
num_init_sims: 4

# Total MD steps per simulation run
num_steps: 500

# Target temperature (K); simulation records when this is first reached
target_temp: 300.0

# Exchange fires once every exchange_step_interval steps (when all sims hit threshold)
exchange_step_interval: 100

# Output directory for experiment results
experiment_dir: ./experiment_output

tasks:
  MD:
    cpu_reqs: 1
    gpu_reqs: 0
    pre_exec: []

  EXCHANGE:
    cpu_reqs: 1
    gpu_reqs: 0
    pre_exec: []