# =============================================================================
# MiniApps Workflow — workflow-specific parameters
# =============================================================================

debug: false
# engine: dragon  # use DDSIM_BACKEND env var instead
num_replicas: 4
home_dir:      "MiniApps"
telemetry:     true
telemetry_dir: "telemetry-output"

total_num_sim:            10
max_sim_batch:            4
training_cores:           1
free_resources_for_train: true
miniapps_data_ready:      4     # signal inference-ready after this many sims complete (counts
                                # both normally-finished and prediction-cancelled sims)
train_every_n_sims:       4     # new sims completed since last training run before retraining
                                # (defaults to miniapps_data_ready when absent)
phase:                    0
num_step:                 100
num_epochs:               100
clean_unregistered_sims:  false

src_dir: ""   # leave empty to use the miniapps/ directory (default)

# Per-task python executable — set to the python binary of the target venv,
# or leave empty to inherit the current interpreter.
executable: ""
