# =============================================================================
# MiniApps Workflow — workflow-specific parameters
# =============================================================================

debug: false
# engine: dragon  # use DDSIM_BACKEND env var instead
num_replicas: 4
home_dir:      "MiniApps"
telemetry:     true
telemetry_dir: "telemetry-output"

total_num_sim:            10
max_sim_batch:            4
training_cores:           1
gpus_per_node:            4     # total GPUs on the node (Dragon only)
gpu_id:                   0     # GPU reserved for this replica's training/inference (Dragon only)
                                # set per-replica: 0 for replica 0, 1 for replica 1, etc.
free_resources_for_train: true  # cancels sims to free CPU slots (Concurrent only; no effect on Dragon)
miniapps_data_ready:      4     # signal inference-ready after this many sims complete
phase:                    0
num_step:                 100
num_epochs:               100
clean_unregistered_sims:  false

src_dir: ""   # leave empty to use the miniapps/ directory (default)

# Per-task python executable — set to the python binary of the target venv,
# or leave empty to inherit the current interpreter.
executable: ""
