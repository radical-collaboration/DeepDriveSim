# =============================================================================
# MiniApps Workflow — workflow-specific parameters
# =============================================================================

debug: false
# engine: dragon  # use DDSIM_BACKEND env var instead
num_replicas: 4
home_dir:      "MiniApps"
telemetry:     true
telemetry_dir: "telemetry-output"

total_num_sim:            10
max_sim_batch:            4
training_cores:           1
free_resources_for_train: true
miniapps_data_ready:      2     # trigger training once 2 sims complete; leaves more running when free_resources fires
sleep_time:               5     # monitor poll interval (s); keep << sim duration to catch running sims
phase:                    0
num_step:                 500   # ~5–15 s per sim on CPU; must exceed sleep_time so sims are running at first poll
num_epochs:               100
num_mult:                 1
clean_unregistered_sims:  false

src_dir: ""   # leave empty to use the miniapps/ directory (default)

# Per-task python executable — set to the python binary of the target venv,
# or leave empty to inherit the current interpreter.
executable: ""
