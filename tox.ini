[tox]
envlist = py39,py310,py311,py312,py313
isolated_build = true

# Shared test deps — listed explicitly so tox installs them regardless of
# whether the isolated-build extras step fires (tox 4 + --no-deps quirk).
[testenv]
deps =
    pytest
    pytest-asyncio
    pytest-timeout
    pytest-cov
    pydantic-settings
    numpy
    pyyaml
    packaging>=23
extras = dev
commands = python -m pytest tests/unit {posargs}

# Integration test
[testenv:{py39,py310,py311,py312,py313}-all]
deps =
    pytest
    pytest-asyncio
    pytest-timeout
    pytest-cov
    pydantic-settings
    numpy
    pyyaml
    packaging>=23
extras = dev
setenv =
    RADICAL_VERBOSE=DEBUG
commands_pre =
    radical-stack
commands = python -m pytest tests/integration {posargs}

# Linting
[testenv:lint]
deps =
    ruff
extras = lint
commands =
    python -m ruff check ddsim workflows tests
    python -m ruff format --check ddsim workflows tests

# Formatting
[testenv:format]
deps =
    ruff
extras = lint
commands =
    python -m ruff format ddsim workflows tests
    python -m ruff check --fix ddsim workflows tests

# Coverage
[testenv:coverage]
deps =
    pytest
    pytest-asyncio
    pytest-timeout
    pytest-cov
    pydantic-settings
    numpy
    pyyaml
    packaging>=23
extras = dev
commands = python -m pytest --cov=ddsim --cov=workflows --cov-report=html --cov-report=term {posargs}
